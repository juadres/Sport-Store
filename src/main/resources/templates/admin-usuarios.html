<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Usuarios - SportStore 2025</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-dark text-white">
    <!-- Header Unificado -->
    <div th:replace="fragments/header :: header"></div>

    <div class="container py-5 mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2><i class="fas fa-users me-2"></i>Gestión de Usuarios</h2>
                <small class="text-muted">Administra los usuarios de SportStore 2025</small>
            </div>
            <a th:href="@{/admin}" class="btn btn-outline-primary">
                <i class="fas fa-arrow-left me-1"></i> Volver al Dashboard
            </a>
        </div>

        <!-- Mensajes flash -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-dark table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Roles</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${usuarios}">
                                <td th:text="${u.id}"></td>
                                <td th:text="${u.nombre}"></td>
                                <td th:text="${u.email}"></td>
                                <td>
                                    <span th:each="r : ${u.roles}" class="badge bg-primary me-1" 
                                          th:text="${r.nombre}"></span>
                                </td>
                                <td>
                                    <form th:action="@{'/admin/usuarios/reset/' + ${u.id}}" method="post" 
                                          style="display:inline-block;" th:if="${u.email != #authentication.name}">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-sm btn-warning" 
                                                th:title="'Restablecer contraseña de ' + ${u.email}">
                                            <i class="fas fa-key me-1"></i> Restablecer
                                        </button>
                                    </form>
                                    <span th:if="${u.email == #authentication.name}" class="text-muted">
                                        <i class="fas fa-user me-1"></i> Tú
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Unificado -->
    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
