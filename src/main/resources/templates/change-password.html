<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - SportStore 2025</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header Unificado -->
    <div th:replace="fragments/header :: header"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                                <i class="fas fa-key fa-2x text-white"></i>
                            </div>
                            <h2 class="fw-bold">Cambiar Contraseña</h2>
                            <p class="text-muted">Actualiza tu contraseña de acceso a SportStore 2025</p>
                        </div>

                        <!-- Mensajes -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                            <i class="fas fa-exclamation-triangle"></i> 
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                            <i class="fas fa-check-circle"></i> 
                            <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- FORMULARIO COMPLETO MANTENIENDO TODAS LAS VALIDACIONES -->
                        <form th:action="@{/change-password}" method="post" id="changePasswordForm">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Contraseña Actual</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="currentPassword" name="currentPassword" required
                                           oninput="validateCurrentPassword()">
                                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('currentPassword')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <div class="valid-feedback" id="currentPasswordValid" style="display: none;">
                                    <i class="fas fa-check-circle"></i> Contraseña actual válida
                                </div>
                                <div class="invalid-feedback" id="currentPasswordError" style="display: none;">
                                    <i class="fas fa-exclamation-circle"></i>
                                    <span id="currentPasswordErrorText"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="newPassword" class="form-label">Nueva Contraseña</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="newPassword" name="newPassword" required
                                           oninput="validateNewPassword()">
                                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('newPassword')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                
                                <!-- Barra de fortaleza de contraseña -->
                                <div class="progress-container mt-2">
                                    <div class="d-flex justify-content-between mb-1">
                                        <small>Fortaleza:</small>
                                        <small id="strengthText" class="text-muted">Débil</small>
                                    </div>
                                    <div class="progress" style="height: 6px; border-radius: 3px;">
                                        <div id="passwordStrength" class="password-strength strength-weak" style="width: 0%"></div>
                                    </div>
                                </div>

                                <div class="valid-feedback" id="newPasswordValid" style="display: none;">
                                    <i class="fas fa-check-circle"></i> Nueva contraseña válida
                                </div>
                                <div class="invalid-feedback" id="newPasswordError" style="display: none;">
                                    <i class="fas fa-exclamation-circle"></i>
                                    <span id="newPasswordErrorText"></span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Confirmar Nueva Contraseña</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                                           oninput="validateConfirmPassword()">
                                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmPassword')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <div class="valid-feedback" id="confirmPasswordValid" style="display: none;">
                                    <i class="fas fa-check-circle"></i> Contraseñas coinciden
                                </div>
                                <div class="invalid-feedback" id="confirmPasswordError" style="display: none;">
                                    <i class="fas fa-exclamation-circle"></i>
                                    <span id="confirmPasswordErrorText"></span>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" id="submitButton" disabled>
                                    <i class="fas fa-save me-2"></i> Actualizar Contraseña
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Unificado -->
    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- MANTENIENDO TODO EL JAVASCRIPT ORIGINAL DE VALIDACIONES -->
    <script>
        // Variables de estado de validación
        let isCurrentPasswordValid = false;
        let isNewPasswordValid = false;
        let isConfirmPasswordValid = false;

        function togglePassword(inputId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = passwordInput.parentNode.querySelector('button i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function validateCurrentPassword() {
            const input = document.getElementById('currentPassword');
            const errorElement = document.getElementById('currentPasswordError');
            const errorText = document.getElementById('currentPasswordErrorText');
            const validElement = document.getElementById('currentPasswordValid');
            const value = input.value.trim();

            // Reset estados
            input.classList.remove('is-valid', 'is-invalid');
            errorElement.style.display = 'none';
            validElement.style.display = 'none';

            if (value === '') {
                showError(input, errorElement, errorText, 'La contraseña actual es requerida');
                isCurrentPasswordValid = false;
                updateSubmitButton();
                return;
            }

            if (value.length < 1) {
                showError(input, errorElement, errorText, 'La contraseña actual es requerida');
                isCurrentPasswordValid = false;
                updateSubmitButton();
                return;
            }

            // Si pasa las validaciones
            showValid(input, validElement);
            isCurrentPasswordValid = true;
            updateSubmitButton();
        }

        // Adoptar validación de contraseña similar a la del registro (requisitos más estrictos)
        function validateNewPassword() {
            const input = document.getElementById('newPassword');
            const errorElement = document.getElementById('newPasswordError');
            const errorText = document.getElementById('newPasswordErrorText');
            const validElement = document.getElementById('newPasswordValid');
            const strengthBar = document.getElementById('passwordStrength');
            const strengthText = document.getElementById('strengthText');
            const value = input.value;

            // Reset estados
            input.classList.remove('is-valid', 'is-invalid');
            errorElement.style.display = 'none';
            validElement.style.display = 'none';

            if (value === '') {
                showError(input, errorElement, errorText, 'La nueva contraseña es requerida');
                updatePasswordStrength(0);
                isNewPasswordValid = false;
                updateSubmitButton();
                return;
            }

            // 1. Longitud mínima 8 caracteres
            if (value.length < 8) {
                showError(input, errorElement, errorText, `La contraseña debe tener al menos 8 caracteres (actual: ${value.length})`);
                updatePasswordStrength(value.length / 8 * 25);
                isNewPasswordValid = false;
                updateSubmitButton();
                return;
            }

            // 2. Máximo 30 caracteres
            if (value.length > 30) {
                showError(input, errorElement, errorText, `La contraseña debe tener máximo 30 caracteres (actual: ${value.length})`);
                updatePasswordStrength(100);
                isNewPasswordValid = false;
                updateSubmitButton();
                return;
            }

            // 3. No mismo carácter más de 3 veces
            const charCount = {};
            let hasRepeatedChar = false;
            for (let char of value) {
                charCount[char] = (charCount[char] || 0) + 1;
                if (charCount[char] > 3) {
                    hasRepeatedChar = true;
                    break;
                }
            }
            if (hasRepeatedChar) {
                showError(input, errorElement, errorText, 'No se permite el mismo carácter más de 3 veces');
                updatePasswordStrength(50);
                isNewPasswordValid = false;
                updateSubmitButton();
                return;
            }

            // 4. Verificar requisitos específicos
            const hasLowercase = /[a-z]/.test(value);
            const hasUppercase = /[A-Z]/.test(value);
            const hasNumber = /[0-9]/.test(value);
            const hasSpecial = /[!@#$%^&*()_+\-=[\]{};':"\\|,.<>\/?]/.test(value);

            if (!hasLowercase || !hasUppercase || !hasNumber || !hasSpecial) {
                const missing = [];
                if (!hasLowercase) missing.push('minúscula');
                if (!hasUppercase) missing.push('mayúscula');
                if (!hasNumber) missing.push('número');
                if (!hasSpecial) missing.push('símbolo');
                
                showError(input, errorElement, errorText, `Falta: ${missing.join(', ')}`);
                updatePasswordStrength(60);
                isNewPasswordValid = false;
                updateSubmitButton();
                return;
            }

            // 5. Calcular fortaleza
            let strength = calculatePasswordStrength(value);
            updatePasswordStrength(strength.score);

            // Validar que no sea igual a la actual
            const currentPassword = document.getElementById('currentPassword').value;
            if (value === currentPassword) {
                showError(input, errorElement, errorText, 'La nueva contraseña no puede ser igual a la actual');
                isNewPasswordValid = false;
                updateSubmitButton();
                return;
            }

            // Si pasa todas las validaciones
            showValid(input, validElement);
            isNewPasswordValid = true;
            validateConfirmPassword(); // Re-validar confirmación
        }

        function validateConfirmPassword() {
            const input = document.getElementById('confirmPassword');
            const errorElement = document.getElementById('confirmPasswordError');
            const errorText = document.getElementById('confirmPasswordErrorText');
            const validElement = document.getElementById('confirmPasswordValid');
            const value = input.value;
            const newPassword = document.getElementById('newPassword').value;

            // Reset estados
            input.classList.remove('is-valid', 'is-invalid');
            errorElement.style.display = 'none';
            validElement.style.display = 'none';

            if (value === '') {
                showError(input, errorElement, errorText, 'Debes confirmar la nueva contraseña');
                isConfirmPasswordValid = false;
                updateSubmitButton();
                return;
            }

            if (value !== newPassword) {
                showError(input, errorElement, errorText, 'Las contraseñas no coinciden');
                isConfirmPasswordValid = false;
                updateSubmitButton();
                return;
            }

            // Si pasa las validaciones
            showValid(input, validElement);
            isConfirmPasswordValid = true;
            updateSubmitButton();
        }

        // Funciones auxiliares para mostrar errores/válidos (compartidas)
        function showError(input, errorElement, errorTextElement, message) {
            input.classList.add('is-invalid');
            input.classList.remove('is-valid');
            errorTextElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function showValid(input, validElement) {
            input.classList.add('is-valid');
            input.classList.remove('is-invalid');
            validElement.style.display = 'block';
        }

        function calculatePasswordStrength(password) {
            let score = 0;
            let messages = [];

            if (password.length >= 12) score += 30;
            else if (password.length >= 8) score += 20;

            if (/[a-z]/.test(password)) score += 10;
            if (/[A-Z]/.test(password)) score += 10;
            if (/[0-9]/.test(password)) score += 10;
            if (/[!@#$%^&*()_+\-=[\]{};':"\\|,.<>\/?]/.test(password)) score += 15;

            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score += 10;
            if (/[0-9]/.test(password) && /[!@#$%^&*()_+\-=[\]{};':"\\|,.<>\/?]/.test(password)) score += 10;

            if (/(.)\1{2,}/.test(password)) score -= 15;
            if (/123|abc|qwerty|password|admin/i.test(password)) score -= 25;

            if (score >= 80) messages.push('Contraseña fuerte');
            else if (score >= 60) messages.push('Contraseña buena');
            else if (score >= 40) messages.push('Contraseña aceptable');
            else messages.push('Contraseña débil');

            return { score: Math.max(0, Math.min(100, score)), message: messages.join('. ') };
        }

        function updatePasswordStrength(score) {
            const strengthBar = document.getElementById('passwordStrength');
            const strengthText = document.getElementById('strengthText');
            
            strengthBar.className = 'password-strength';
            strengthText.className = '';

            if (score <= 25) {
                strengthBar.classList.add('strength-weak');
                strengthText.textContent = 'Débil';
                strengthText.className = 'text-danger';
                strengthBar.style.width = '25%';
            } else if (score <= 50) {
                strengthBar.classList.add('strength-fair');
                strengthText.textContent = 'Aceptable';
                strengthText.className = 'text-warning';
                strengthBar.style.width = '50%';
            } else if (score <= 75) {
                strengthBar.classList.add('strength-good');
                strengthText.textContent = 'Buena';
                strengthText.className = 'text-info';
                strengthBar.style.width = '75%';
            } else {
                strengthBar.classList.add('strength-strong');
                strengthText.textContent = 'Fuerte';
                strengthText.className = 'text-success';
                strengthBar.style.width = '100%';
            }
        }

        // Actualizar estado del botón de envío
        function updateSubmitButton() {
            const submitButton = document.getElementById('submitButton');
            if (isCurrentPasswordValid && isNewPasswordValid && isConfirmPasswordValid) {
                submitButton.disabled = false;
            } else {
                submitButton.disabled = true;
            }
        }

        // Inicializar validaciones
        document.addEventListener('DOMContentLoaded', function() {
            validateCurrentPassword();
            validateNewPassword();
            validateConfirmPassword();
        });
    </script>
</body>
</html>
