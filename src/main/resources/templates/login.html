<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SportStore 2025</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-dark">
    <!-- Header Unificado -->
    <div th:replace="fragments/header :: header"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Encabezado con más espacio -->
                        <div class="text-center mb-5">
                            <div class="auth-icon mb-4">
                                <i class="fas fa-running"></i>
                            </div>
                            <h1 class="auth-title mb-2">Bienvenido</h1>
                            <p class="auth-subtitle">Ingresa a tu cuenta SportStore</p>
                        </div>

                        <!-- Mensajes con mejor espaciado -->
                        <div th:if="${param.error}" class="alert alert-danger auth-alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Email o contraseña incorrectos
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success auth-alert">
                            <i class="fas fa-check-circle me-2"></i>
                            Sesión cerrada correctamente
                        </div>

                        <!-- Formulario con más espacio -->
                        <form th:action="@{/login}" method="post" class="auth-form">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            
                            <div class="mb-4">
                                <label for="username" class="form-label auth-label">Email</label>
                                <div class="input-group auth-input">
                                    <span class="input-group-text">
                                        <i class="fas fa-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control" id="username" name="username"
                                           placeholder="tu@email.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label auth-label">Contraseña</label>
                                <div class="input-group auth-input">
                                    <span class="input-group-text">
                                        <i class="fas fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control" id="password" name="password"
                                           placeholder="Tu contraseña" required>
                                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <div class="auth-help mt-2">
                                    <small class="text-muted">
                                        <i class="fas fa-info-circle me-1"></i>
                                        ¿Problemas para ingresar? Contacta al administrador.
                                    </small>
                                </div>
                            </div>

                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-primary btn-lg auth-submit">
                                    <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
                                </button>
                            </div>
                        </form>

                        <!-- Enlace de registro con mejor separación -->
                        <div class="auth-footer text-center pt-4 border-top">
                            <p class="mb-3">¿No tienes cuenta aún?</p>
                            <a th:href="@{/register}" class="btn btn-outline-primary">
                                <i class="fas fa-user-plus me-2"></i> Crear Cuenta
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Unificado -->
    <div th:replace="fragments/footer :: footer"></div>

    <script>
        function togglePassword(inputId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = passwordInput.parentNode.querySelector('button i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
