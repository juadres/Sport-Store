<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Compras - SportStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}" />
</head>
<body class="bg-dark text-white">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-receipt me-2"></i>Mis Compras</h2>
        <a th:href="@{/tienda}" class="btn btn-primary">
            <i class="fas fa-arrow-left me-2"></i> Volver a la Tienda
        </a>
    </div>

    <div th:if="${ventas.isEmpty()}">
        <div class="card text-center py-5">
            <div class="card-body">
                <i class="fas fa-shopping-bag fa-3x text-muted mb-3"></i>
                <h4 class="text-muted">Aún no has realizado compras</h4>
                <p class="text-muted">Explora nuestra tienda y encuentra tu equipamiento ideal</p>
                <a th:href="@{/tienda}" class="btn btn-primary btn-lg">
                    <i class="fas fa-store me-2"></i> Comenzar a Comprar
                </a>
            </div>
        </div>
    </div>

    <div th:if="${!ventas.isEmpty()}">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>N° Factura</th>
                                <th>Fecha</th>
                                <th>Subtotal</th>
                                <th>IVA</th>
                                <th>Total</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="venta : ${ventas}">
                                <td>
                                    <strong th:text="${venta.numeroFactura}"></strong>
                                </td>
                                <td th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="'$' + ${#numbers.formatDecimal(venta.subtotal, 1, 2, 'COMMA')}"></td>
                                <td th:text="'$' + ${#numbers.formatDecimal(venta.iva, 1, 2, 'COMMA')}"></td>
                                <td>
                                    <strong class="text-warning" 
                                            th:text="'$' + ${#numbers.formatDecimal(venta.total, 1, 2, 'COMMA')}"></strong>
                                </td>
                                <td>
                                    <a th:href="@{/descargar-factura/{id}(id=${venta.id})}"
                                       class="btn btn-danger btn-sm">
                                        <i class="fas fa-file-pdf me-1"></i> PDF
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
