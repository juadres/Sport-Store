<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Compras - SportStore 2025</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}" />
</head>
<body class="bg-dark">
    <!-- Header Unificado -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <!-- Header con mejor diseño -->
        <div class="page-header mb-5">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="page-title">
                        <i class="fas fa-receipt me-3"></i>Mis Compras
                    </h1>
                    <p class="page-subtitle text-muted">Historial completo de tus pedidos</p>
                </div>
                <a th:href="@{/tienda}" class="btn btn-primary btn-lg">
                    <i class="fas fa-arrow-left me-2"></i> Volver a la Tienda
                </a>
            </div>
        </div>

        <!-- Estado vacío -->
        <div th:if="${ventas.isEmpty()}" class="empty-state">
            <div class="card empty-card text-center py-5">
                <div class="card-body">
                    <i class="fas fa-shopping-bag empty-icon"></i>
                    <h3 class="empty-title">Aún no has realizado compras</h3>
                    <p class="empty-text">Explora nuestra tienda y encuentra tu equipamiento ideal</p>
                    <a th:href="@{/tienda}" class="btn btn-primary btn-lg empty-btn">
                        <i class="fas fa-store me-2"></i> Comenzar a Comprar
                    </a>
                </div>
            </div>
        </div>

        <!-- Tabla de compras -->
        <div th:if="${!ventas.isEmpty()}">
            <div class="purchases-card">
                <div class="card-header purchases-header">
                    <h5 class="mb-0">
                        <i class="fas fa-history me-2"></i>Historial de Compras
                        <span class="badge purchases-badge" th:text="${ventas.size()}"></span>
                    </h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table purchases-table">
                            <thead class="purchases-thead">
                                <tr>
                                    <th class="ps-4">N° Factura</th>
                                    <th>Fecha</th>
                                    <th>Subtotal</th>
                                    <th>IVA</th>
                                    <th>Total</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="venta : ${ventas}" class="purchase-row">
                                    <td class="ps-4">
                                        <strong class="invoice-number" th:text="${venta.numeroFactura}"></strong>
                                    </td>
                                    <td class="purchase-date" th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td class="purchase-subtotal" th:text="'$' + ${#numbers.formatDecimal(venta.subtotal, 1, 2, 'POINT')}"></td>
                                    <td class="purchase-iva" th:text="'$' + ${#numbers.formatDecimal(venta.iva, 1, 2, 'POINT')}"></td>
                                    <td class="purchase-total">
                                        <strong class="total-amount" 
                                                th:text="'$' + ${#numbers.formatDecimal(venta.total, 1, 2, 'POINT')}"></strong>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/descargar-factura/{id}(id=${venta.id})}"
                                           class="btn btn-pdf btn-sm"
                                           title="Descargar factura PDF">
                                            <i class="fas fa-file-pdf me-1"></i> PDF
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Unificado -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
