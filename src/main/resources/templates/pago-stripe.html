<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pagar con Tarjeta</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        .hidden { display: none; }
        .processing { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <div style="max-width: 500px; margin: auto; padding: 20px;">
        <h1>Pagar con Stripe</h1>
        
        <!-- Datos ocultos del pago -->
        <input type="hidden" id="paymentIntentId" th:value="${pagoData.paymentIntentId}">
        <input type="hidden" id="email" th:value="${pagoData.email}">
        <input type="hidden" id="referencia" th:value="${pagoData.referencia}">
        
        <!-- Resumen -->
        <div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 20px;">
            <h3>Resumen de compra</h3>
            <p>Total: <strong th:text="'$' + ${#numbers.formatDecimal(total, 1, 'COMMA', 0)} + ' COP'"></strong></p>
            <p>Referencia: <span th:text="${referencia}"></span></p>
            <p>Email: <span th:text="${email}"></span></p>
        </div>
        
        <!-- Formulario de pago -->
        <form id="payment-form">
            <div id="card-element" style="border: 1px solid #ccc; padding: 10px; margin-bottom: 15px;"></div>
            <div id="card-errors" class="hidden" style="color: red; margin-bottom: 15px;"></div>
            
            <button type="submit" id="submit-btn" style="padding: 10px 20px; background: #007bff; color: white; border: none;">
                Pagar ahora
            </button>
            
            <a th:href="@{/carrito}" style="margin-left: 10px;">Cancelar</a>
        </form>
        
        <!-- Mensajes -->
        <div id="success-message" class="hidden" style="color: green; margin-top: 15px;">
            ¡Pago exitoso! Redirigiendo...
        </div>
        
        <div id="error-message" class="hidden" style="color: red; margin-top: 15px;"></div>
    </div>

    <script>
        // Configuración
        const stripe = Stripe("[[${stripePublicKey}]]");
        const clientSecret = "[[${clientSecret}]]";
        const csrfToken = "[[${_csrf.token}]]";
        const csrfHeader = "[[${_csrf.headerName}]]";
        
        // Elementos
        const elements = stripe.elements();
        const cardElement = elements.create('card');
        cardElement.mount('#card-element');
        
        // Manejar envío
        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Deshabilitar botón
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Procesando...';
            
            try {
                // Confirmar pago con Stripe
                const { paymentIntent, error } = await stripe.confirmCardPayment(clientSecret, {
                    payment_method: { card: cardElement }
                });
                
                if (error) {
                    document.getElementById('card-errors').textContent = error.message;
                    document.getElementById('card-errors').classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Pagar ahora';
                    return;
                }
                
                if (paymentIntent.status === 'succeeded') {
                    // Enviar al backend
                    const response = await fetch('/stripe/procesar-exito', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            [csrfHeader]: csrfToken
                        },
                        body: new URLSearchParams({
                            paymentIntentId: paymentIntent.id,
                            email: document.getElementById('email').value,
                            referencia: document.getElementById('referencia').value
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // Mostrar éxito
                        document.getElementById('success-message').classList.remove('hidden');
                        document.getElementById('payment-form').classList.add('hidden');
                        
                        // Redirigir después de 2 segundos
                        setTimeout(() => {
                            window.location.href = '/mis-compras';
                        }, 2000);
                    } else {
                        throw new Error(result.error || 'Error al procesar');
                    }
                }
                
            } catch (error) {
                document.getElementById('error-message').textContent = 'Error: ' + error.message;
                document.getElementById('error-message').classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Pagar ahora';
            }
        });
        
        // Manejar errores de tarjeta en tiempo real
        cardElement.on('change', (event) => {
            const errorElement = document.getElementById('card-errors');
            if (event.error) {
                errorElement.textContent = event.error.message;
                errorElement.classList.remove('hidden');
            } else {
                errorElement.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
