<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fragment Header</title>
</head>
<body>
    <!-- Header Fragment -->
    <header class="header" th:fragment="header">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    <i class="fas fa-dumbbell me-2"></i>SportStore 2025
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- Navegación para usuarios autenticados -->
                    <ul class="navbar-nav me-auto" th:if="${#authorization.expression('isAuthenticated()')}">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/tienda}">
                                <i class="fas fa-store me-1"></i> Tienda
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/mis-compras}">
                                <i class="fas fa-receipt me-1"></i> Mis Compras
                            </a>
                        </li>
                        <li class="nav-item" th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}">
                            <a class="nav-link" th:href="@{/admin}">
                                <i class="fas fa-cog me-1"></i> Admin
                            </a>
                        </li>
                    </ul>
                    
                    <!-- Navegación para usuarios no autenticados -->
                    <ul class="navbar-nav me-auto" th:unless="${#authorization.expression('isAuthenticated()')}">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/#features}">Beneficios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/#categories}">Categorías</a>
                        </li>
                    </ul>
                    
                    <ul class="navbar-nav ms-auto">
                        <!-- Carrito solo para usuarios autenticados -->
                        <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                            <a class="nav-link position-relative" th:href="@{/carrito}">
                                <i class="fas fa-shopping-cart me-1"></i> Carrito
                                <div th:if="${carrito != null and #lists.size(carrito) > 0}">
                                      th:text="${#lists.size(carrito)}"></span>
                            </a>
                        </li>
                        
                        <!-- Menú usuario autenticado -->
                        <li class="nav-item dropdown" th:if="${#authorization.expression('isAuthenticated()')}">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                <i class="fas fa-user me-1"></i>
                                <span th:text="${#authentication.principal.username}"></span>
                            </a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" th:href="@{/change-password}">
                                        <i class="fas fa-key me-2"></i> Cambiar Contraseña
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/logout}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="dropdown-item">
                                            <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                        
                        <!-- Login/Register para usuarios no autenticados -->
                        <li class="nav-item" th:unless="${#authorization.expression('isAuthenticated()')}">
                            <a class="nav-link" th:href="@{/login}">
                                <i class="fas fa-sign-in-alt me-1"></i> Iniciar Sesión
                            </a>
                        </li>
                        <li class="nav-item" th:unless="${#authorization.expression('isAuthenticated()')}">
                            <a class="btn btn-primary ms-2" th:href="@{/register}">
                                <i class="fas fa-user-plus me-1"></i> Registrarse
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
