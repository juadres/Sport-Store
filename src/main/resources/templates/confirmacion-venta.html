<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>¡Compra Exitosa! - SportStore 2025</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-dark">
    <!-- Header Unificado -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Card principal simplificada -->
                <div class="card success-card">
                    <div class="card-body text-center p-5">
                        
                        <!-- Icono de éxito -->
                        <div class="success-icon mb-4">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        
                        <!-- Título y mensaje -->
                        <h2 class="success-title mb-3">¡Compra Exitosa!</h2>
                        <p class="success-message mb-4">
                            Tu pedido ha sido procesado correctamente. 
                            <strong>¡Te esperamos pronto!</strong>
                        </p>

                        <!-- Información básica si está disponible -->
                        <div th:if="${venta != null}" class="order-info mb-4">
                            <div class="info-item">
                                <span class="info-label">N° de Orden:</span>
                                <span class="info-value" th:text="${venta.numeroFactura}"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Total:</span>
                                <span class="info-price" th:text="'$' + ${#numbers.formatDecimal(venta.total, 1, 2, 'POINT')}"></span>
                            </div>
                            
                            <!-- ✅ NUEVO: Conversión de Monedas -->
                            <div class="info-item" th:if="${currencyConversions}">
                                <span class="info-label">También:</span>
                                <span class="info-value">
                                    <span th:each="conv, iterStat : ${currencyConversions}" th:if="${conv.key != 'COP'}">
                                        <span th:text="${conv.value}"></span>
                                        <span th:if="${!iterStat.last}"> • </span>
                                    </span>
                                </span>
                            </div>
                        </div>

                        <!-- Botones de acción -->
                        <div class="action-buttons">
                            <div class="d-grid gap-2">
                                <a th:href="@{/tienda}" class="btn btn-primary btn-lg">
                                    <i class="fas fa-shopping-bag me-2"></i> Seguir Comprando
                                </a>
                                
                                <a th:if="${venta != null}" th:href="@{/descargar-factura/{id}(id=${venta.id})}" 
                                   class="btn btn-outline-secondary">
                                    <i class="fas fa-file-pdf me-2"></i> Descargar Factura
                                </a>
                                
                                <a th:href="@{/mis-compras}" class="btn btn-outline-light btn-sm mt-2">
                                    <i class="fas fa-history me-2"></i> Ver Historial
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Unificado -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
