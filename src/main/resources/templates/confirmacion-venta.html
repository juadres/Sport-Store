<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>¡Compra Exitosa! - SportStore 2025</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-dark text-white">
    <!-- Header Unificado -->
    <div th:replace="fragments/header :: header"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card text-center">
                <div class="card-body p-5">
                    <div class="text-success mb-4">
                        <i class="fas fa-check-circle fa-5x"></i>
                    </div>
                    
                    <h2 class="text-success mb-3">¡Compra Procesada con Éxito!</h2>
                    
                    <p class="lead mb-4">
                        Gracias por tu compra en SportStore 2025. Tu equipamiento deportivo está en camino.
                    </p>

                    <div class="card bg-dark border-light mb-4">
                        <div class="card-body">
                            <div class="row text-start">
                                <div class="col-md-6">
                                    <p><strong>N° Factura:</strong> <span th:text="${venta.numeroFactura}"></span></p>
                                    <p><strong>Fecha:</strong> 
                                        <span th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></span>
                                    </p>
                                </div>
                                <div class="col-md-6">
                                    <p><strong>Cliente:</strong> <span th:text="${venta.usuario.nombre}"></span></p>
                                    <p><strong>Email:</strong> <span th:text="${venta.usuario.email}"></span></p>
                                </div>
                            </div>
                            
                            <hr class="my-3">
                            
                            <div class="row text-start">
                                <div class="col-12">
                                    <h5 class="mb-3">Detalles de la Compra:</h5>
                                    <div th:each="detalle : ${venta.detalles}" class="d-flex justify-content-between mb-2">
                                        <span th:text="${detalle.producto.nombre} + ' x ' + ${detalle.cantidad}"></span>
                                        <span th:text="'$' + ${#numbers.formatDecimal(detalle.subtotal, 1, 2, 'COMMA')}"></span>
                                    </div>
                                    <hr>
                                    <div class="d-flex justify-content-between fw-bold">
                                        <span>Total:</span>
                                        <span class="h5 text-warning" 
                                              th:text="'$' + ${#numbers.formatDecimal(venta.total, 1, 2, 'COMMA')}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-center">
                        <a th:href="@{/descargar-factura/{id}(id=${venta.id})}" 
                           class="btn btn-danger btn-lg me-md-2">
                            <i class="fas fa-file-pdf me-2"></i> Descargar Factura PDF
                        </a>

                        <a th:href="@{/tienda}" class="btn btn-primary btn-lg">
                            <i class="fas fa-shopping-bag me-2"></i> Seguir Comprando
                        </a>
                    </div>
                    
                    <div class="mt-4">
                        <a th:href="@{/mis-compras}" class="btn btn-outline-light">
                            <i class="fas fa-history me-2"></i> Ver Historial de Compras
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- Footer Unificado -->
    <div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
